<svg viewBox="0 0 1000 285" fill="none" xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="Lucía Cordero — education">
  <style>
    :root {
      --text: #24292f;
      --muted: #57606a;
      --rule: #8c959f;
      --accent: #424a53;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f0f3f6;
        --muted: #b6bec9;
        --rule: #6e7681;
        --accent: #d0d7de;
      }
    }

    .mono {
      font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas,
                   "Liberation Mono", monospace;
    }

    .rise {
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .a1 { animation-delay: .12s; }
    .a2 { animation-delay: .30s; }

    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; opacity: 1; }
    }
  </style>

  <line x1="120" y1="12" x2="120" y2="270"
        stroke="var(--rule)" stroke-width="1" opacity=".45"/>

  <g class="rise a1">
    <text class="mono" x="36" y="46" font-size="12" fill="var(--accent)" letter-spacing="1.6">2024 –</text>
    <text class="mono" x="140" y="46" font-size="15" font-weight="600" fill="var(--text)">
      Universidad Carlos III de Madrid · MSc Applied Artificial Intelligence
    </text>
    <text class="mono" x="140" y="72" font-size="13.5" fill="var(--muted)">
      GPA 8.98/10 · Deep Learning · Multiagent Systems · Business Analytics
    </text>
    <text class="mono" x="140" y="94" font-size="13.5" fill="var(--muted)">
      honors in Probabilistic Methods in AI &amp; Ambient Intelligence
    </text>
  </g>

  <g class="rise a2">
    <text class="mono" x="25" y="166" font-size="12" fill="var(--accent)" letter-spacing="1.2">2020–24</text>
    <text class="mono" x="140" y="166" font-size="15" font-weight="600" fill="var(--text)">
      Universidad Carlos III de Madrid · BSc Data Science &amp; Engineering
    </text>
    <text class="mono" x="140" y="192" font-size="13.5" fill="var(--muted)">
      Minor in Economics · ML · neural networks · computer vision · AI for business
    </text>
    <text class="mono" x="140" y="214" font-size="13.5" fill="var(--muted)">
      exchange @ Concordia University · Montréal, Canada
    </text>
  </g>
</svg>
